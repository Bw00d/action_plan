development:
  adapter: async

test:
  adapter: test

# Same Heroku Redis as the cache store (production.rb): prefer the TLS
# endpoint, and skip cert verification because Heroku Redis uses
# self-signed certs.
production:
  adapter: redis
  url: <%= ENV['REDIS_TLS_URL'] || ENV.fetch('REDIS_URL') { 'redis://localhost:6379/1' } %>
  ssl_params:
    verify_mode: <%= OpenSSL::SSL::VERIFY_NONE %>
  channel_prefix: action_plan_production
